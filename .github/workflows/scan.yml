name: XAU Signal Scan

on:
  schedule:
    # Trigger every 15 minutes, 24/7. Each job runs for ~13 minutes - deliberately
    # SHORTER than the gap between triggers.
    #
    # This matters: a previous version used ~6-hour jobs with 15-minute triggers, which
    # meant ~23 queued requests piled up behind every running job. GitHub then cancelled
    # the RUNNING job in favour of the queue ("higher priority waiting request exists"),
    # so long jobs kept dying part-way through. Job duration must stay under the trigger
    # interval so a queue never forms.
    #
    # 96 triggers a day also means a dropped trigger costs at most ~15 minutes, instead
    # of the multi-hour gaps we saw when relying on only 2 triggers an hour.
    #
    # 24/7 rather than session hours: trade resolution runs before the session gate, so
    # a trade that hits TP overnight is recorded immediately. Evaluation itself is still
    # gated to 7-16 and 20-23 PKT inside the Python.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Prevent overlapping hourly jobs from fighting over the same state.json
# Scheduled runs share one lock so two loops never write state.json at once.
# Manual runs get their OWN group, so a test fires immediately instead of queueing
# behind a long-running loop. This is safe because manual runs never register signals or
# touch any tally - they only read data and send one status message.
concurrency:
  group: xau-signal-scan-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Continuous scan loop (aligned to 5m candle closes, ~13 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scans are aligned to the 5-minute clock boundaries that candles close on
          # (:00 :05 :10 ...), plus a short buffer so the feed has delivered the closing
          # tick. A fixed "sleep 300" would drift relative to those boundaries and could
          # land mid-candle, delaying detection by up to a full interval.
          BUFFER=20
          # A manual run is a one-shot test: scan once, send the status message, exit.
          # Only scheduled runs need the continuous 27-minute loop.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            LOOP_SECONDS=0
          else
            LOOP_SECONDS=$(( 13*60 ))   # MUST stay under the 15-min trigger interval
          fi
          END=$(( $(date +%s) + LOOP_SECONDS ))
          ITER=0

          while : ; do
            ITER=$((ITER+1))
            echo "--- scan iteration $ITER at $(date -u '+%H:%M:%S UTC') ---"
            SCAN_ITERATION=$ITER python xau_bot.py || echo "scan iteration failed, continuing"

            # Commit state after each scan so signal numbering / TP-SL tallies survive.
            if ! git diff --quiet -- state.json 2>/dev/null; then
              git config user.name "xau-scanner-bot"
              git config user.email "actions@github.com"
              git add state.json
              git commit -m "Update signal state [skip ci]" || true
              git pull --rebase --autostash origin main || true
              git push || echo "push failed, will retry next iteration"
            fi

            # Manual run: one scan is all we need.
            if [ "$LOOP_SECONDS" -eq 0 ]; then
              echo "manual run complete after 1 scan"
              break
            fi

            # Sleep until just after the NEXT 5-minute boundary.
            NOW=$(date +%s)
            SECS_PAST=$(( NOW % 300 ))
            SLEEP_FOR=$(( 300 - SECS_PAST + BUFFER ))
            # If we're already inside the buffer of a fresh boundary, wait for the next one.
            if [ "$SLEEP_FOR" -le "$BUFFER" ]; then
              SLEEP_FOR=$(( SLEEP_FOR + 300 ))
            fi

            NEXT=$(( NOW + SLEEP_FOR ))
            if [ "$NEXT" -ge "$END" ]; then
              echo "window ending, exiting loop"
              break
            fi
            echo "sleeping ${SLEEP_FOR}s until $(date -u -d "@${NEXT}" '+%H:%M:%S UTC')"
            sleep "$SLEEP_FOR"
          done
          echo "Loop finished after $ITER scans."
