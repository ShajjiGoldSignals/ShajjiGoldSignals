name: XAU Signal Scan

on:
  schedule:
    # Every 15 minutes, 24/7, at OFF-PEAK minutes.
    #
    # Why 24/7 and not just session hours: trades hit TP or SL at any time. Resolution
    # runs before the session gate, so a round-the-clock schedule means a trade that
    # closes overnight is recorded immediately instead of waiting for the next session.
    # Evaluation itself is still gated to 7-16 and 20-23 PKT inside the Python.
    #
    # Why four triggers an hour: GitHub treats cron as best effort and drops triggers
    # under load - we lost a full morning and a full evening session to this. 96 chances
    # a day instead of 24 means losing several changes nothing. Minute :00 is avoided
    # entirely; it is the most congested minute on GitHub's infrastructure.
    #
    # Each job now runs for ~5h50m (just under GitHub's 6-hour job limit) rather than 27
    # minutes. Long jobs mean coverage does NOT depend on catching a trigger every half
    # hour - one trigger that lands keeps scanning for most of the day. The frequent
    # triggers still queue behind it (see concurrency) and take over the instant it ends,
    # so handover is seamless and a dropped trigger costs nothing.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Prevent overlapping hourly jobs from fighting over the same state.json
# Scheduled runs share one lock so two loops never write state.json at once.
# Manual runs get their OWN group, so a test fires immediately instead of queueing
# behind a long-running loop. This is safe because manual runs never register signals or
# touch any tally - they only read data and send one status message.
concurrency:
  group: xau-signal-scan-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Continuous scan loop (aligned to 5m candle closes, runs ~5h50m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          # Scans are aligned to the 5-minute clock boundaries that candles close on
          # (:00 :05 :10 ...), plus a short buffer so the feed has delivered the closing
          # tick. A fixed "sleep 300" would drift relative to those boundaries and could
          # land mid-candle, delaying detection by up to a full interval.
          BUFFER=20
          # A manual run is a one-shot test: scan once, send the status message, exit.
          # Only scheduled runs need the continuous 27-minute loop.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            LOOP_SECONDS=0
          else
            LOOP_SECONDS=$(( 350*60 ))   # ~5h50m, just under the 6h job limit
          fi
          END=$(( $(date +%s) + LOOP_SECONDS ))
          ITER=0

          while : ; do
            ITER=$((ITER+1))
            echo "--- scan iteration $ITER at $(date -u '+%H:%M:%S UTC') ---"
            SCAN_ITERATION=$ITER python xau_bot.py || echo "scan iteration failed, continuing"

            # Commit state after each scan so signal numbering / TP-SL tallies survive.
            if ! git diff --quiet -- state.json 2>/dev/null; then
              git config user.name "xau-scanner-bot"
              git config user.email "actions@github.com"
              git add state.json
              git commit -m "Update signal state [skip ci]" || true
              git pull --rebase --autostash origin main || true
              git push || echo "push failed, will retry next iteration"
            fi

            # Manual run: one scan is all we need.
            if [ "$LOOP_SECONDS" -eq 0 ]; then
              echo "manual run complete after 1 scan"
              break
            fi

            # Sleep until just after the NEXT 5-minute boundary.
            NOW=$(date +%s)
            SECS_PAST=$(( NOW % 300 ))
            SLEEP_FOR=$(( 300 - SECS_PAST + BUFFER ))
            # If we're already inside the buffer of a fresh boundary, wait for the next one.
            if [ "$SLEEP_FOR" -le "$BUFFER" ]; then
              SLEEP_FOR=$(( SLEEP_FOR + 300 ))
            fi

            NEXT=$(( NOW + SLEEP_FOR ))
            if [ "$NEXT" -ge "$END" ]; then
              echo "window ending, exiting loop"
              break
            fi
            echo "sleeping ${SLEEP_FOR}s until $(date -u -d "@${NEXT}" '+%H:%M:%S UTC')"
            sleep "$SLEEP_FOR"
          done
          echo "Loop finished after $ITER scans."
